<!DOCTYPE html>
<html lang="vi-VN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>CMS Admin — Song Ngọc</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logos/logo-sn.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ── CMS Design Tokens ── */
    :root {
      --sn-green: #00854A; --sn-green-dk: #005C34; --sn-green-lt: #E6F4ED;
      --sn-orange: #F38022; --sn-orange-lt: #FEF0E3;
      --sidebar-w: 240px;
      --header-h: 56px;
      --bg: #F4F6F8; --surface: #fff; --border: #DEE2E6;
      --text: #212529; --text-2: #6C757D;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
      --radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }
    a { color: var(--sn-green); text-decoration: none; }
    button { cursor: pointer; border: none; font-family: inherit; }
    input, textarea, select { font-family: inherit; outline: none; }
    img { max-width: 100%; display: block; }

    /* ── Login Screen ── */
    #loginScreen {
      position: fixed; inset: 0; z-index: 999;
      background: linear-gradient(135deg, #0A100C, var(--sn-green-dk));
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--surface); border-radius: 20px; padding: 40px 36px;
      width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
      text-align: center;
    }
    .login-box img { height: 44px; margin: 0 auto 20px; }
    .login-box h2 { font-size: 1.2rem; margin-bottom: 6px; }
    .login-box p  { font-size: .82rem; color: var(--text-2); margin-bottom: 24px; }
    .login-input {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .9rem; margin-bottom: 14px;
      transition: border-color .2s;
    }
    .login-input:focus { border-color: var(--sn-green); }
    .login-btn {
      width: 100%; padding: 12px; border-radius: 8px;
      background: var(--sn-green); color: #fff;
      font-size: .9rem; font-weight: 700;
      transition: background .2s;
    }
    .login-btn:hover { background: var(--sn-green-dk); }
    .login-error { display: none; color: #DC3545; font-size: .78rem; margin-top: 10px; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--text); color: rgba(255,255,255,.8);
      display: flex; flex-direction: column; overflow: hidden;
      transition: transform .25s;
    }
    .sidebar-logo {
      padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-logo img { height: 32px; filter: brightness(0) invert(1); }
    .sidebar-logo span { font-size: .78rem; font-weight: 700; color: rgba(255,255,255,.7); }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
    .nav-group-label {
      font-size: .62rem; font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase; color: rgba(255,255,255,.35);
      padding: 12px 20px 6px;
    }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; font-size: .82rem; font-weight: 600;
      color: rgba(255,255,255,.65); transition: all .18s; border-radius: 0;
      cursor: pointer; background: none; width: 100%; text-align: left;
      border-left: 3px solid transparent;
    }
    .nav-link i { width: 18px; font-size: .85em; }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,.06); }
    .nav-link.active { color: #fff; background: rgba(0,133,74,.2); border-left-color: var(--sn-green); }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08); }
    .sidebar-footer a {
      display: flex; align-items: center; gap: 8px;
      font-size: .78rem; color: rgba(255,255,255,.5); transition: color .18s;
    }
    .sidebar-footer a:hover { color: #fff; }

    /* ── Main layout ── */
    .cms-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Top bar ── */
    .topbar {
      height: var(--header-h); background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; flex-shrink: 0; box-shadow: var(--shadow);
    }
    .topbar-title { font-size: 1rem; font-weight: 800; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }
    .t-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: .78rem; font-weight: 700;
      transition: all .18s;
    }
    .t-btn-primary { background: var(--sn-green); color: #fff; }
    .t-btn-primary:hover { background: var(--sn-green-dk); }
    .t-btn-ghost { background: var(--bg); color: var(--text-2); border: 1px solid var(--border); }
    .t-btn-ghost:hover { background: var(--border); }
    .t-btn-danger { background: #DC3545; color: #fff; }
    .t-btn-danger:hover { background: #B02A37; }

    /* ── Content area ── */
    .cms-content { flex: 1; overflow-y: auto; padding: 24px; }

    /* ── Dashboard cards ── */
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; margin-bottom: 28px; }
    .dash-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; display: flex;
      flex-direction: column; gap: 8px; box-shadow: var(--shadow);
    }
    .dash-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .dash-num  { font-size: 1.8rem; font-weight: 900; line-height: 1; }
    .dash-lbl  { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-2); }

    /* ── Table ── */
    .cms-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .cms-table-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px;
    }
    .cms-table-title { font-weight: 800; font-size: .95rem; }
    .search-input {
      padding: 8px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .82rem; width: 220px;
      transition: border-color .18s;
    }
    .search-input:focus { border-color: var(--sn-green); }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--bg); padding: 10px 16px; text-align: left;
      font-size: .72rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: .5px; color: var(--text-2); white-space: nowrap;
    }
    tbody tr { border-top: 1px solid var(--border); }
    tbody tr:hover { background: #F8F9FA; }
    tbody td { padding: 12px 16px; font-size: .85rem; vertical-align: middle; }
    .tb-img { width: 64px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .tb-badge {
      display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 10px;
      font-size: .68rem; font-weight: 700;
    }
    .tb-badge-green  { background: var(--sn-green-lt);  color: var(--sn-green);  }
    .tb-badge-orange { background: var(--sn-orange-lt); color: var(--sn-orange); }
    .tb-badge-gray   { background: #F1F3F5; color: #6C757D; }
    .tb-actions { display: flex; gap: 6px; }
    .tb-btn {
      width: 30px; height: 30px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; transition: all .18s;
    }
    .tb-btn-edit { background: var(--sn-green-lt); color: var(--sn-green); }
    .tb-btn-edit:hover { background: var(--sn-green); color: #fff; }
    .tb-btn-del { background: #FEE2E2; color: #DC3545; }
    .tb-btn-del:hover { background: #DC3545; color: #fff; }
    .tb-btn-view { background: #E0F2FE; color: #0284C7; }
    .tb-btn-view:hover { background: #0284C7; color: #fff; }

    /* ── Pagination ── */
    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 4px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .pg-btn {
      width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem; font-weight: 700; background: var(--surface);
      cursor: pointer; transition: all .18s; color: var(--text-2);
    }
    .pg-btn.active, .pg-btn:hover { background: var(--sn-green); color: #fff; border-color: var(--sn-green); }

    /* ── Modal / Drawer ── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 800;
      background: rgba(0,0,0,.5); align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: 16px; width: 100%;
      max-width: 680px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      animation: modalIn .2s ease;
    }
    @keyframes modalIn { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .modal-header h3 { font-size: 1rem; font-weight: 800; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      color: var(--text-2); font-size: .9rem; transition: all .18s;
    }
    .modal-close:hover { background: var(--border); color: var(--text); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 10px;
    }

    /* ── Form fields ── */
    .field-group { margin-bottom: 18px; }
    .field-label { display: block; font-size: .75rem; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-2); }
    .field-input {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .88rem; transition: border-color .18s;
    }
    .field-input:focus { border-color: var(--sn-green); }
    textarea.field-input { min-height: 100px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field-hint { font-size: .7rem; color: var(--text-2); margin-top: 5px; }

    /* ── Image upload ── */
    .img-upload-zone {
      border: 2px dashed var(--border); border-radius: 10px;
      padding: 24px; text-align: center; cursor: pointer;
      transition: border-color .18s, background .18s;
    }
    .img-upload-zone:hover { border-color: var(--sn-green); background: var(--sn-green-lt); }
    .img-upload-zone i { font-size: 2rem; color: var(--text-2); margin-bottom: 8px; }
    .img-preview { max-height: 120px; margin: 10px auto 0; border-radius: 8px; }

    /* ── Contacts / submissions table ── */
    .msg-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px; margin-bottom: 10px;
      box-shadow: var(--shadow); transition: box-shadow .18s;
    }
    .msg-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .msg-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
    .msg-name { font-weight: 800; font-size: .92rem; }
    .msg-date { font-size: .72rem; color: var(--text-2); }
    .msg-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .msg-meta span { font-size: .78rem; color: var(--text-2); display: flex; align-items: center; gap: 5px; }
    .msg-meta i { color: var(--sn-green); }
    .msg-content { font-size: .85rem; color: var(--text-2); line-height: 1.6; }

    /* ── Status indicator ── */
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status-ok  { background: #198754; }
    .status-err { background: #DC3545; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9000;
      background: #198754; color: #fff; padding: 12px 22px; border-radius: 10px;
      font-size: .85rem; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.15);
      display: none; align-items: center; gap: 10px;
    }
    .toast.show { display: flex; }
    .toast.error { background: #DC3545; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: -100%; top: 0; bottom: 0; z-index: 700; transition: left .25s; }
      .sidebar.mobile-open { left: 0; }
      .field-row { grid-template-columns: 1fr; }
    }

    /* Spinner */
    .spin { animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-box">
    <img src="assets/logos/logo-sn.png" alt="Song Ngọc">
    <h2>CMS Admin</h2>

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <img src="assets/logos/logo-sn.png" alt="SN">

  </div>

  <nav class="sidebar-nav">

      <i class="fas fa-hard-hat"></i> Dự án
    </button>
    <button class="nav-link" data-tab="sectors">
      <i class="fas fa-layer-group"></i> Lĩnh vực
    </button>
    <button class="nav-link" data-tab="news">
      <i class="fas fa-newspaper"></i> Tin tức
    </button>
    <button class="nav-link" data-tab="activities">
      <i class="fas fa-people-group"></i> Hoạt động
    </button>
    <button class="nav-link" data-tab="jobs">
      <i class="fas fa-briefcase"></i> Tuyển dụng

    <div class="nav-group-label" style="margin-top:8px">Cài đặt</div>

<!-- ── MAIN ── -->
<main class="cms-main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button id="sidebarToggle" style="display:none;padding:6px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--border)">
        <i class="fas fa-bars"></i>
      </button>
      <div class="topbar-title" id="tabTitle">Dashboard</div>
    </div>
    <div class="topbar-actions">
      <button class="t-btn t-btn-ghost" id="refreshBtn" title="Làm mới dữ liệu">

      </button>

<!-- ── EDIT MODAL ── -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Thêm mới</h3>
      <button class="modal-close" id="modalClose"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"><!-- fields --></div>
    <div class="modal-footer">
      <button class="t-btn t-btn-ghost" id="modalCancel">Hủy</button>
      <button class="t-btn t-btn-primary" id="modalSave">
        <i class="fas fa-floppy-disk"></i> Lưu
      </button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ════════════════════════════════
   CONFIG
════════════════════════════════ */
const CMS = {
  GAS_URL:  'https://script.google.com/macros/s/YOUR_GAS_ID/exec',
  PASSWORD: '', // Set via login — stored in sessionStorage
  PAGE_SIZE: 15,
};

/* ════════════════════════════════
   AUTH
════════════════════════════════ */
const auth = {
  check() { return sessionStorage.getItem('sn_cms_token') === 'ok'; },
  login(pwd) {
    /* NOTE: In production, replace with a real auth check against GAS or Cloudflare Worker */
    const HASH = sessionStorage.getItem('sn_admin_hash') || ''; // set by GAS on first deploy
    /* Simple: check against a locally-stored password (for demo) */
    /* TODO: Replace with: await fetch(GAS + '?action=auth&pwd='+pwd) */
    const LOCAL_PWD = localStorage.getItem('sn_cms_pwd') || 'SongNgoc@2024';
    if (pwd === LOCAL_PWD) {
      sessionStorage.setItem('sn_cms_token', 'ok');
      return true;
    }
    return false;
  },
  logout() {
    sessionStorage.removeItem('sn_cms_token');
    location.reload();
  }
};

/* Login form */
document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const pwd = document.getElementById('loginPassword').value;
  if (auth.login(pwd)) {
    document.getElementById('loginScreen').style.display = 'none';
    init();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
});

if (auth.check()) {
  document.getElementById('loginScreen').style.display = 'none';
}

document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); auth.logout(); });

/* ════════════════════════════════
   DATA LAYER
════════════════════════════════ */
const DataStore = {
  _cache: {},

  async load(tab) {
    if (this._cache[tab]) return this._cache[tab];
    try {
      const url = `${CMS.GAS_URL}?tab=${tab}&token=${sessionStorage.getItem('sn_cms_token')}`;
      const res  = await fetch(url);
      const data = await res.json();
      if (Array.isArray(data)) { this._cache[tab] = data; return data; }
    } catch {}
    /* Fallback to local JSON */
    try {
      const res  = await fetch(`data/${tab}.json`);
      const data = await res.json();
      this._cache[tab] = Array.isArray(data) ? data : [];
      return this._cache[tab];
    } catch { return []; }
  },

  async save(tab, record, action = 'upsert') {
    delete this._cache[tab];
    try {
      const res = await fetch(CMS.GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'cms_write',
          token: sessionStorage.getItem('sn_cms_token'),
          tab, action, record,
          id: record.id
        })
      });
      return (await res.json()).success;
    } catch (err) {
      console.error('Save failed', err);
      return false;
    }
  },

  async delete(tab, id) {
    delete this._cache[tab];
    return this.save(tab, { id }, 'delete');
  }
};

/* ════════════════════════════════
   TOAST
════════════════════════════════ */
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = `toast show${type === 'error' ? ' error' : ''}`;
  el.innerHTML = `<i class="fas fa-${type === 'error' ? 'circle-xmark' : 'circle-check'}"></i> ${msg}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ════════════════════════════════
   MODAL
════════════════════════════════ */
const Modal = {
  _onSave: null,
  open(title, fieldsHtml, onSave) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML  = fieldsHtml;
    document.getElementById('editModal').classList.add('open');
    this._onSave = onSave;
    /* Image preview */
    document.querySelectorAll('.img-upload-input').forEach(inp => {
      inp.addEventListener('change', function() {
        const prev = this.closest('.field-group').querySelector('.img-preview');
        if (!prev || !this.files[0]) return;
        const url = URL.createObjectURL(this.files[0]);
        prev.src = url; prev.style.display = 'block';
      });
    });
  },
  close() {
    document.getElementById('editModal').classList.remove('open');
    this._onSave = null;
  },
  async save() {
    const btn = document.getElementById('modalSave');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch spin"></i> Đang lưu...';
    try {
      await this._onSave?.();
      this.close();
      toast('Đã lưu thành công!');
    } catch (err) {
      toast(err.message || 'Lỗi khi lưu', 'error');
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-floppy-disk"></i> Lưu';
    }
  }
};

document.getElementById('modalCancel').addEventListener('click', () => Modal.close());
document.getElementById('modalSave').addEventListener('click', () => Modal.save());
document.getElementById('editModal').addEventListener('click', e => { if (e.target === document.getElementById('editModal')) Modal.close(); });

/* ── Generic CRUD Table ── */
async function renderCrudTable(sheetTab, cols, openModalFn) {
  const data = await DataStore.load(sheetTab);
  const el   = document.getElementById('cmsContent');

  let q = '';
  let page = 1;

  const render = () => {
    const filtered = data.filter(r => !q || Object.values(r).some(v => String(v).toLowerCase().includes(q)));
    const total = filtered.length;
    const pages = Math.ceil(total / CMS.PAGE_SIZE);
    const slice = filtered.slice((page-1)*CMS.PAGE_SIZE, page*CMS.PAGE_SIZE);

    el.innerHTML = `
      <div class="cms-table-wrap">
        <div class="cms-table-header">
          <div class="cms-table-title">Tổng cộng: <strong>${total}</strong></div>
          <input type="search" class="search-input" placeholder="Tìm kiếm..." value="${q}" id="tbSearch">
        </div>
        <div style="overflow-x:auto">
        <table>
          <thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}<th>Thao tác</th></tr></thead>
          <tbody>
            ${slice.length ? slice.map(row => `<tr>
              ${cols.map(c => `<td>${c.render(row)}</td>`).join('')}
              <td><div class="tb-actions">
                <button class="tb-btn tb-btn-edit" data-id="${row.id}" title="Sửa"><i class="fas fa-pen"></i></button>
                <button class="tb-btn tb-btn-del"  data-id="${row.id}" title="Xóa"><i class="fas fa-trash"></i></button>
              </div></td>
            </tr>`).join('') : '<tr><td colspan="99" style="text-align:center;padding:30px;color:var(--text-2)">Không có dữ liệu</td></tr>'}
          </tbody>
        </table>
        </div>
        <div class="pagination">
          ${Array.from({length:pages},(_,i)=>`<button class="pg-btn${i+1===page?' active':''}" data-p="${i+1}">${i+1}</button>`).join('')}
        </div>
      </div>`;

    /* Events */
    el.querySelector('#tbSearch')?.addEventListener('input', e => { q = e.target.value.toLowerCase(); page=1; render(); });
    el.querySelectorAll('.pg-btn').forEach(b => b.addEventListener('click', () => { page = +b.dataset.p; render(); }));
    el.querySelectorAll('.tb-btn-edit').forEach(b => b.addEventListener('click', () => {
      const item = data.find(r => String(r.id) === b.dataset.id);
      if (item) openModalFn(item, sheetTab, data);
    }));
    el.querySelectorAll('.tb-btn-del').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Xác nhận xóa?')) return;
      const ok = await DataStore.delete(sheetTab, b.dataset.id);
      if (ok) {
        const idx = data.findIndex(r => String(r.id) === b.dataset.id);
        if (idx >= 0) data.splice(idx, 1);
        render(); toast('Đã xóa!');
      } else { toast('Xóa thất bại!', 'error'); }
    }));
  };

  render();
}

    <div class="field-group"><label class="field-label">Mức lương / Thu nhập</label><input class="field-input" id="f-salary" value="${esc(item.salary||item.luong||'')}"></div>
    <div class="field-group"><label class="field-label">Mô tả công việc</label><textarea class="field-input" id="f-desc" rows="4">${esc(item.description||item.mo_ta||'')}</textarea></div>
    <div class="field-group"><label class="field-label">Yêu cầu</label><textarea class="field-input" id="f-req" rows="3">${esc(item.requirements||item.yeu_cau||'')}</textarea></div>
    <div class="field-group"><label class="field-label"><input type="checkbox" id="f-active"${item.active!='0'?' checked':''}> Đang tuyển (hiển thị trên website)</label></div>
  `, async () => {
    const record = {
      id: item.id || String(Date.now()),
      title: document.getElementById('f-title').value.trim(),
      department: document.getElementById('f-dept').value,
      type: document.getElementById('f-type').value,
      location: document.getElementById('f-loc').value,
      deadline: document.getElementById('f-deadline').value,
      salary: document.getElementById('f-salary').value,
      description: document.getElementById('f-desc').value,
      requirements: document.getElementById('f-req').value,
      active: document.getElementById('f-active').checked ? '1' : '0',
    };
    if (!record.title) throw new Error('Vị trí không được để trống');
    const ok = await DataStore.save('tuyen-dung-posts', record);
    if (!ok) throw new Error('Lưu thất bại');
    if (item.id) { const idx=data.findIndex(r=>r.id===item.id); if(idx>=0)data[idx]=record; }
    else data.unshift(record);
    renderTab(currentTab);
  });
}

/* ════════════════════════════════
   UTILS
════════════════════════════════ */
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatDate(d) { try { return d ? new Date(d).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'; } catch { return d||'—'; } }
function slugify(str) { return str.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-'); }

function init() {
  /* Sidebar mobile toggle */
  const toggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 768) { toggle.style.display = ''; }
  toggle?.addEventListener('click', () => sidebar.classList.toggle('mobile-open'));

  setTab('dashboard');
}

if (auth.check()) init();
